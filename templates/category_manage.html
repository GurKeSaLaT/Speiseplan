{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="card-title mb-0 fw-bold">⚙️ Kategorien verwalten</h4>
                <a href="/manage" class="btn btn-sm btn-outline-light fw-bold"><- Zurück</a>
            </div>
            <div class="card-body p-4">
                <form action="/add-category" method="POST" class="mb-4">
                    <label class="form-label fw-bold">Neue Kategorie hinzufügen</label>
                    <div class="input-group">
                        <input type="text" name="category_name" class="form-control" placeholder="z.B. Grillen, Dessert..." required>
                        <button type="submit" class="btn btn-dark fw-bold">Hinzufügen</button>
                    </div>
                </form>

                <h5 class="fw-bold mb-3 text-muted">Aktuelle Kategorien:</h5>
                <div class="list-group shadow-sm rounded border">
                    {% for cat in categories %}
                    <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <span class="fs-5">{{ cat.name }}</span>
                        <form action="/delete-category/{{ cat.id }}" method="POST" class="m-0">
                            <button type="submit" class="btn btn-outline-danger" {% if cat.recipes %}disabled title="Enthält noch Rezepte"{% endif %}>
                                Kategorie löschen 🗑️
                            </button>
                        </form>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
