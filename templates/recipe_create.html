{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h4 class="card-title mb-0 fw-bold">✨ Neues Essen eintragen</h4>
            </div>
            <div class="card-body p-4">
                <form action="/add-recipe" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Name des Gerichts</label>
                        <input type="text" name="name" class="form-control" required placeholder="z.B. Spaghetti Bolognese">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Kategorie</label>
                        <select name="category_id" class="form-select" required>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <h5 class="border-bottom pb-2 mb-3 text-success fw-bold">Nährwerte (optional, pro Portion)</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-3"><label class="small text-muted fw-bold">Kcal</label><input type="number" name="calories" class="form-control"></div>
                        <div class="col-3"><label class="small text-muted fw-bold">Eiweiß (g)</label><input type="number" step="0.1" name="protein" class="form-control"></div>
                        <div class="col-3"><label class="small text-muted fw-bold">Kohlh. (g)</label><input type="number" step="0.1" name="carbs" class="form-control"></div>
                        <div class="col-3"><label class="small text-muted fw-bold">Fett (g)</label><input type="number" step="0.1" name="fat" class="form-control"></div>
                    </div>

                    <h5 class="border-bottom pb-2 mb-3 text-success fw-bold">Zutaten (optional)</h5>
                    <div id="ingredients-container" class="mb-2">
                        <div class="row g-2 mb-2">
                            <div class="col-6"><input type="text" name="ing_name[]" class="form-control" placeholder="Zutat"></div>
                            <div class="col-3"><input type="number" step="0.1" name="ing_amount[]" class="form-control" placeholder="Menge"></div>
                            <div class="col-3"><input type="text" name="ing_unit[]" class="form-control" placeholder="Einheit (g, Stk)"></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mb-4" onclick="addIngredientField()">+ Zutat hinzufügen</button>
                    
                    <div class="d-flex gap-2">
                        <a href="/manage" class="btn btn-outline-secondary w-50">Abbrechen</a>
                        <button type="submit" class="btn btn-success w-50 fw-bold">Rezept Speichern</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function addIngredientField() {
    const container = document.getElementById('ingredients-container');
    const div = document.createElement('div');
    div.className = 'row g-2 mb-2';
    div.innerHTML = `
        <div class="col-6"><input type="text" name="ing_name[]" class="form-control" placeholder="Zutat"></div>
        <div class="col-3"><input type="number" step="0.1" name="ing_amount[]" class="form-control" placeholder="Menge"></div>
        <div class="col-3"><input type="text" name="ing_unit[]" class="form-control" placeholder="Einheit (g, Stk)"></div>
    `;
    container.appendChild(div);
}
</script>
{% endblock %}
