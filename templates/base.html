<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍽️ Speiseplanhelfer</title>

    <!-- 1. LOKALES BOOTSTRAP CSS (Vollkommen offline) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}" type="text/css">

    <!-- 2. DEINE EIGENE CSS-DATEI MIT CACHE-BREMSE -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ css_version }}" type="text/css">

    <style>
        /* Fallback für die Schriftart, falls Google Fonts blockiert ist */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body>

    <!-- Navigationsleiste -->
    <nav class="navbar navbar-expand-md navbar-dark navbar-custom mb-4 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">🍽️ Speiseplan</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-md-0 gap-2 mt-2 mt-md-0">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path == '/' %}active-custom{% endif %}" href="/">📅 Wochenplaner</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path.startswith('/manage') %}active-custom{% endif %}" href="/manage">⚙️ Verwaltung</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hauptinhalt -->
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <!-- 3. LOKALES BOOTSTRAP JS BUNDLE (Für funktionierende Menüs) -->
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
</body>
</html>
