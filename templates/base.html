<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speiseplanhelfer</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        /* Ein bisschen Feinschliff für ein moderneres Design */
        .card { border-radius: 12px; }
        .btn { border-radius: 8px; }
        .list-group-item { border-left: none; border-right: none; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🍽️ Speiseplanhelfer</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-expand navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path == '/' %}active fw-bold text-white bg-white bg-opacity-25 rounded{% endif %}" href="/">📅 Wochenplaner</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 {% if request.path == '/manage' %}active fw-bold text-white bg-white bg-opacity-25 rounded{% endif %}" href="/manage">⚙️ Rezepte & Kategorien</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <!-- Bootstrap JavaScript für die Modals und Navigation -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
